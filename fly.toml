app = "dota-bot"
primary_region = "ord"  # Chicago - close to Minneapolis

[build]

[env]
  # Add your environment variables in the Fly.io dashboard or via `fly secrets set`

[mounts]
  source = "dota_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[processes]
  app = "python bot.py"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["app"]

  # Fly's default is 25 connections, and every draft-room watcher holds one
  # open for the whole draft.
  [services.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
