app = "dota-bot"
primary_region = "ord"  # Chicago - close to Minneapolis

[build]

[env]
  # Add your environment variables in the Fly.io dashboard or via `fly secrets set`

[mounts]
  source = "dota_data"
  destination = "/data"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[processes]
  app = "python bot.py"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
