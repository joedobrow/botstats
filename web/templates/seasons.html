{% extends "base.html" %}
{% block content %}
<h1>Seasons</h1>
<table>
  <thead><tr><th>Season</th><th>Starts</th><th>Signups</th></tr></thead>
  <tbody>
  {% for s in seasons %}
    <tr>
      <td><a href="{{ season_url(s) }}">{{ s.label }}</a></td>
      <td>{{ s.season_start }}</td>
      <td>{% if s.signups_open %}<span class="tag open">Open</span> {% endif %}{% if s.signup_count %}{{ s.signup_count }}{% endif %}</td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="muted">No seasons yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
