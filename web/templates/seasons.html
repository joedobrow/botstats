{% extends "base.html" %}
{% from "macros.html" import season_status %}
{% block content %}
<h1>Seasons</h1>
<table>
  <thead><tr><th>Season</th><th>Starts</th><th>Status</th></tr></thead>
  <tbody>
  {% for s in seasons %}
    <tr>
      <td><a href="{{ season_url(s) }}">{{ s.label }}</a></td>
      <td>{{ s.season_start }}</td>
      <td>{{ season_status(s) }}</td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="muted">No seasons yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
