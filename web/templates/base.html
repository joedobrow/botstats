<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if title %}{{ title }} · {% endif %}RD2L</title>
<link rel="icon" href="/assets/rd2l_logo.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <nav class="wrap">
    <a class="brand" href="/"><img src="/assets/rd2l_logo.png" alt=""> RD2L</a>
    <span class="spacer"></span>
    {% if is_admin %}<a href="/admin" {% if path.startswith('/admin') %}class="active"{% endif %}>Admin</a>{% endif %}
    <a href="/settings" {% if path == '/settings' %}class="active"{% endif %}>Settings</a>
  </nav>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap muted">Match data from OpenDota. Not affiliated with Valve.</footer>
</body>
</html>
