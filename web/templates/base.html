<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if title %}{{ title }} · {% endif %}RD2L</title>
<link rel="icon" href="/assets/rd2l_logo.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <nav class="wrap">
    <a class="brand" href="/"><img src="/assets/rd2l_logo.png" alt=""> RD2L</a>
    <a href="/seasons" {% if path.startswith('/season') %}class="active"{% endif %}>Seasons</a>
    <a href="/players" {% if path.startswith('/player') %}class="active"{% endif %}>Players</a>
    <a href="/rules" {% if path == '/rules' %}class="active"{% endif %}>Rules</a>
    {% if is_admin %}<a href="/admin" {% if path.startswith('/admin') %}class="active"{% endif %}>Admin</a>{% endif %}
    <span class="spacer"></span>
    {% if user %}
      <a class="me" href="/me">{% if user.avatar_url %}<img src="{{ user.avatar_url }}" alt="">{% endif %}{{ user.steam_name or user.account_id }}</a>
      <form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="linklike">Log out</button></form>
    {% else %}
      <a class="button" href="/login?next={{ path|urlencode }}">Log in with Steam</a>
    {% endif %}
  </nav>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap muted">Match data from OpenDota. Not affiliated with Valve.</footer>
</body>
</html>
